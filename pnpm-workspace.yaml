packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  # One fastify per install. With two copies, @fastify/* plugins augment a
  # different FastifyInstance than the app sees, and declaration merging yields
  # nominally distinct types that fail the build. Not a downgrade — a dedupe.
  fastify: '^5.12.3'
  # Both arrive under the Prisma CLI, which pins older copies than the
  # advisories require. Prisma only touches them for MySQL introspection and
  # config merging — neither is on our Postgres runtime path — but the audit
  # gate is a floor, not a judgement call, so force the patched releases.
  # deepmerge-ts: stack exhaustion on recursive objects (GHSA-ggr8-5vv4-36mx).
  # mysql2: auth-plugin downgrade leaking plaintext credentials
  # (GHSA-3f6p-5ww8-9rcr) + GHSA for <=3.23.0.
  deepmerge-ts: '>=8.0.0'
  mysql2: '>=3.23.1'
  # esbuild < 0.28.1 has a HIGH advisory (GHSA-gv7w-rqvm-qjhr: missing binary
  # integrity check → RCE via NPM_CONFIG_REGISTRY). Pulled transitively
  # (Storybook/Vite/tsup), so force every copy to the patched release.
  esbuild: '>=0.28.1'
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@sentry/cli': false
  '@swc/core': true
  argon2: true
  core-js-pure: false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: false
# The supply-chain delay, in minutes: never resolve a version published less
# than 4320 minutes (3 days) ago. Almost every npm account takeover of recent
# years was noticed and the malicious version unpublished within hours to a
# couple of days, so most of that risk disappears by simply not being the first
# to install. The cost is a three-day wait for a release nobody urgently needs.
#
# Why 3 days and not a week: pnpm verifies EVERY entry already in the lockfile
# against this policy, not just new resolutions. A longer window would reject a
# hundred perfectly ordinary transitive entries (the @aws-sdk tree republishes
# almost daily) and the only ways out would be an exclude list nobody can audit
# or turning the policy off — which is how this setting ends up documented but
# absent, exactly the state it was found in.
#
# A CVE patch that cannot wait is the exception, and the exception has a name:
# put the exact `name@version` in the list below with a comment saying why, so
# the waiver is one package instead of the whole policy.
minimumReleaseAge: 4320
# Versions deliberately adopted before the delay above is up.
minimumReleaseAgeExclude:
  # The next-intl 4.14.3 family, already in the lockfile and already reviewed
  # when it was adopted. Listed so turning the policy on did not mean either
  # re-resolving i18n for no reason or weakening the window for everything.
  - next-intl@4.14.3
  - use-intl@4.14.3
  - icu-minify@4.14.3
  - next-intl-swc-plugin-extractor@4.14.3
  - '@aws-sdk/client-s3@3.1068.0'
  - '@aws-sdk/client-ses@3.1068.0'
  - eslint@10.5.0
  - lucide-react@1.18.0
  - react-hook-form@7.79.0
  - '@tailwindcss/node@4.3.1'
  - '@tailwindcss/oxide-android-arm64@4.3.1'
  - '@tailwindcss/oxide-darwin-arm64@4.3.1'
  - '@tailwindcss/oxide-darwin-x64@4.3.1'
  - '@tailwindcss/oxide-freebsd-x64@4.3.1'
  - '@tailwindcss/oxide-linux-arm-gnueabihf@4.3.1'
  - '@tailwindcss/oxide-linux-arm64-gnu@4.3.1'
  - '@tailwindcss/oxide-linux-arm64-musl@4.3.1'
  - '@tailwindcss/oxide-linux-x64-gnu@4.3.1'
  - '@tailwindcss/oxide-linux-x64-musl@4.3.1'
  - '@tailwindcss/oxide-wasm32-wasi@4.3.1'
  - '@tailwindcss/oxide-win32-arm64-msvc@4.3.1'
  - '@tailwindcss/oxide-win32-x64-msvc@4.3.1'
  - '@tailwindcss/oxide@4.3.1'
  - '@tailwindcss/postcss@4.3.1'
  - tailwindcss@4.3.1
onlyBuiltDependencies:
  - esbuild
  - '@prisma/client'
  - prisma
  - '@prisma/engines'
  - argon2
  - sharp
  - '@swc/core'
  - unrs-resolver
