name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @dontpanic/shared build

      # Opens/updates a "Version Packages" PR that bumps versions and writes
      # changelogs from the changesets. Publishing is NOT done here — it happens
      # in publish-create-dontpanic.yml when a `v*` tag is pushed.
      - name: Changesets — open/refresh the version PR
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
