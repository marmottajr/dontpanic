name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @dontpanic/shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Unit tests only — they mock Prisma/cache/mail/storage, so no DB/Redis is
      # needed. The e2e suite (real Postgres) and Playwright smokes are run
      # locally, not in CI, on purpose.
      - name: Test (unit, with coverage)
        run: pnpm test

      - name: Audit (fail on high/critical)
        run: pnpm audit --audit-level high

      - name: Build
        run: pnpm build
