name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dontpanic
          POSTGRES_PASSWORD: dontpanic
          POSTGRES_DB: dontpanic_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dontpanic"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dontpanic:dontpanic@localhost:5432/dontpanic_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-aaaaaaaaaaaaaaaaaaaaaaaa
      JWT_REFRESH_SECRET: ci-refresh-secret-bbbbbbbbbbbbbbbbbbbbbbbb
      CSRF_SECRET: ci-csrf-secret-cccccccccccccccccccccccc
      CACHE_DRIVER: redis
      MAIL_DRIVER: console
      STORAGE_DRIVER: local
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @dontpanic/shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm --filter @dontpanic/api exec prisma migrate deploy

      - name: Test (with coverage)
        run: pnpm test

      - name: Audit (fail on high/critical)
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: Build
        run: pnpm build
